<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>他山之石 · 镜荧侧脸（动漫画风）v3</title>
<style>
  body{background:#0a0c11;color:#dfe3ea;font:"Microsoft YaHei",sans-serif;padding:26px 32px 56px;margin:0}
  h1{font-size:21px;letter-spacing:.16em;margin:0 0 4px}
  .sub{font-size:12px;color:#8892a3;margin-bottom:18px}
  h2{font-size:14px;letter-spacing:.12em;color:#9fb3c8;margin:26px 0 12px;font-weight:600;
     border-left:3px solid #5fe0c8;padding-left:9px}
  .row{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap}
  .v{text-align:center}
  .v .lbl{font-size:11px;color:#8892a3;margin-top:8px;letter-spacing:.06em}
  .tiles{display:flex;gap:12px;align-items:flex-end}
  svg{display:block}
  .note{margin-top:24px;border:1px solid #232b38;border-radius:6px;padding:16px 20px;background:#0e1219;
        font-size:12.5px;line-height:1.9;color:#9aa5b5;max-width:1580px}
  .note b{color:#cfe6dd}
</style>
</head>
<body>
<h1>镜荧 · 侧脸头像（动漫画风）v3</h1>
<div class="sub">v2 → v3：加线稿描边、发束改尖角分束、眼睛分层（上睑投影/瞳孔/双高光）、补高领与颈饰、背景加月与星</div>

<h2>一、表情</h2>
<div class="row" id="r1"></div>
<h2>二、裁切与底色</h2>
<div class="row" id="r2"></div>

<div class="note">
  <b>线稿是关键差别</b>：v2 是纯色块拼贴，所以像矢量插画；v3 给脸形、发形、衣领都加了 <code>stroke</code> 描边，
  并把发梢改成收尖的束状，才接近赛璐璐动画的观感。<br>
  <b>导出</b>：选定后我用同一份路径渲染 256×256 存 <code>Game/Assets/icon.png</code>，跑 <code>Bootstrap.SetAppIcon</code>。
</div>

<script>
const L='#2b3446';           // 线稿色
function svg(uid,o){
  const bg=o.bg||'#0e1626', clip=o.circle?`clip-path="url(#ccp${uid})"`:`clip-path="url(#rcp${uid})"`;
  const tf=o.zoom?`transform="translate(-34 -26) scale(1.28)"`:'';
  const eye = o.wink
    ? `<path d="M164 198 C 186 186 214 184 234 192" fill="none" stroke="${L}" stroke-width="9" stroke-linecap="round"/>
       <path d="M172 214 C 190 222 214 220 230 212" fill="none" stroke="${L}" stroke-width="5" stroke-linecap="round" opacity=".8"/>`
    : `<path d="M166 200 C 176 176 212 168 234 184 C 238 212 210 230 184 221 C 172 217 166 208 166 200 Z" fill="#f9fcff"/>
       <g clip-path="url(#e${uid})">
         <ellipse cx="202" cy="203" rx="23" ry="25" fill="url(#i${uid})"/>
         <ellipse cx="202" cy="205" rx="9.5" ry="13" fill="#0f1b2e"/>
         <path d="M176 180 C 196 170 220 172 236 184 L 236 168 L 176 166 Z" fill="#1a2233" opacity=".5"/>
         <ellipse cx="190" cy="190" rx="8" ry="6" fill="#f2fbff"/>
         <ellipse cx="214" cy="217" rx="6" ry="4" fill="#a8e2ff" opacity=".9"/>
       </g>
       <path d="M164 198 C 176 172 214 164 236 182" fill="none" stroke="${L}" stroke-width="9" stroke-linecap="round"/>
       <path d="M170 222 C 188 230 214 226 232 212" fill="none" stroke="${L}" stroke-width="3.4" stroke-linecap="round" opacity=".75"/>
       <path d="M166 196 C 158 190 154 185 152 178" fill="none" stroke="${L}" stroke-width="5" stroke-linecap="round"/>
       <path d="M168 208 C 160 209 156 210 152 210" fill="none" stroke="${L}" stroke-width="3.4" stroke-linecap="round" opacity=".85"/>`;
  return `<svg viewBox="0 0 512 512" width="256" height="256" style="width:${o.s}px;height:${o.s}px;border-radius:${o.circle?'50%':'8%'}">
  <defs>
    <clipPath id="rcp${uid}"><rect width="512" height="512" rx="46"/></clipPath>
    <clipPath id="ccp${uid}"><circle cx="256" cy="256" r="256"/></clipPath>
    <clipPath id="e${uid}"><path d="M166 200 C 176 176 212 168 234 184 C 238 212 210 230 184 221 C 172 217 166 208 166 200 Z"/></clipPath>
    <linearGradient id="i${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173e7e"/><stop offset=".5" stop-color="#3f86d8"/><stop offset="1" stop-color="#a8e2ff"/>
    </linearGradient>
    <linearGradient id="h${uid}" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#fbfdff"/><stop offset=".5" stop-color="#e6eef8"/><stop offset="1" stop-color="#b7c7de"/>
    </linearGradient>
    <linearGradient id="b${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${bg}"/><stop offset="1" stop-color="${o.bg2||'#080d18'}"/>
    </linearGradient>
  </defs>
  <g ${clip}>
    <rect width="512" height="512" fill="url(#b${uid})"/>
    <!-- 星与月 -->
    <g fill="#dfe9f5" opacity=".85">
      <circle cx="72" cy="70" r="2.4"/><circle cx="126" cy="126" r="1.8"/><circle cx="60" cy="196" r="1.6"/>
      <circle cx="452" cy="66" r="2.2"/><circle cx="418" cy="140" r="1.6"/><circle cx="486" cy="112" r="1.8"/>
    </g>
    <path d="M96 108 a 40 40 0 1 0 34 62 a 32 32 0 1 1 -34 -62 Z" fill="#e9f1fb" opacity=".9"/>
    <!-- 远山 -->
    <g>
      <path d="M0 452 L104 356 L196 436 L300 340 L400 428 L512 356 L512 512 L0 512 Z" fill="#182740"/>
      <path d="M0 486 L128 414 L246 486 L364 412 L512 490 L512 512 L0 512 Z" fill="#111c30"/>
    </g>

    <g ${tf}>
      <!-- 后发大形（带线稿） -->
      <path d="M170 150 C 178 74 252 30 332 44 C 414 58 450 134 444 218
               C 438 308 418 396 410 470 L 300 470 C 330 392 344 316 340 250
               C 336 178 300 132 244 124 C 208 120 182 132 170 150 Z"
            fill="url(#h${uid})" stroke="${L}" stroke-width="3.4"/>

      <!-- 颈与肩 -->
      <path d="M256 262 C 262 292 260 314 252 332 L 306 346 C 344 360 370 400 376 470
               L 168 470 C 176 404 202 366 238 346 C 248 326 250 296 246 266 Z"
            fill="#ffe6d4" stroke="${L}" stroke-width="3"/>
      <path d="M246 292 C 262 300 288 300 306 292 L 306 306 C 286 314 260 314 246 306 Z" fill="#eab89f" opacity=".7"/>
      <!-- 高领晚礼服 -->
      <path d="M228 336 C 268 352 322 356 352 382 C 372 400 380 432 382 470 L 164 470
               C 170 414 192 366 228 336 Z" fill="#223049" stroke="${L}" stroke-width="3"/>
      <path d="M232 336 C 262 350 300 356 326 372 L 318 384 C 292 370 258 360 230 350 Z" fill="#3c5a78"/>
      <path d="M266 350 L 300 470 L 274 470 L 250 358 Z" fill="#2b3d59"/>
      <!-- 颈饰（血族大小姐） -->
      <path d="M244 318 C 266 328 292 328 312 320 L 314 334 C 292 342 264 342 242 332 Z" fill="#1a2233" stroke="${L}" stroke-width="2.4"/>
      <path d="M272 336 l 12 -8 12 8 -12 14 Z" fill="#b0342a" stroke="${L}" stroke-width="2"/>

      <!-- 脸（侧脸轮廓，带线稿） -->
      <path d="M268 68 C 214 70 178 108 172 156 C 170 172 166 182 161 192
               C 156 202 150 212 152 219 C 154 226 162 226 167 230
               C 172 234 170 240 164 244 C 170 250 178 252 175 259
               C 172 268 180 281 198 290 C 222 301 256 301 280 289
               C 306 275 320 245 322 209 L 324 120 C 322 88 300 68 268 68 Z"
            fill="#ffe6d4" stroke="${L}" stroke-width="3.2"/>
      <path d="M280 289 C 306 275 320 245 322 209 L 324 120 C 322 88 300 68 268 68
               C 294 76 308 100 310 136 C 312 200 302 258 280 289 Z" fill="#f2c9b0"/>
      <path d="M174 160 C 192 140 226 130 262 134 C 250 150 232 162 214 174
               C 198 184 184 188 176 186 Z" fill="#eab89f" opacity=".5"/>

      <!-- 鼻与嘴 -->
      <path d="M166 196 C 160 204 155 212 157 218 C 159 223 165 224 170 227" fill="none"
            stroke="${L}" stroke-width="3" stroke-linecap="round" opacity=".85"/>
      <path d="M168 242 C 178 236 190 238 196 245 C 188 252 176 252 168 242 Z" fill="#d98b8b" stroke="${L}" stroke-width="2.2"/>
      <path d="M172 246 C 180 252 189 251 194 246 C 190 255 178 256 172 246 Z" fill="#c26b6b"/>
      <path d="M175 243 L 181 243 L 178 251 Z" fill="#ffffff"/>
      <ellipse cx="200" cy="234" rx="16" ry="7" fill="#f3a89e" opacity=".45"/>

      <!-- 眼 -->
      ${eye}
      <path d="M178 156 C 198 146 224 146 242 154" fill="none" stroke="#aebfd4" stroke-width="6.5"
            stroke-linecap="round" opacity=".95"/>

      <!-- 刘海：五束弧形发梢（不是锯齿） -->
      <path d="M166 176
               C 174 88 250 36 334 52 C 410 66 446 130 444 200
               L 424 188
               Q 414 214 398 206  Q 384 198 376 178
               Q 368 210 350 214  Q 336 216 328 190
               Q 318 218 300 212  Q 288 206 282 184
               Q 270 212 252 210  Q 240 206 236 184
               Q 224 208 208 202  Q 196 196 192 178
               Q 182 190 166 176 Z"
            fill="url(#h${uid})" stroke="${L}" stroke-width="3"/>
      <g stroke="${L}" stroke-width="2.2" fill="none" opacity=".45">
        <path d="M212 116 C 202 146 196 170 196 190"/>
        <path d="M262 96 C 254 130 250 158 252 182"/>
        <path d="M316 92 C 312 124 312 152 318 176"/>
        <path d="M372 106 C 374 136 380 162 392 186"/>
      </g>
      <path d="M212 122 C 246 88 306 76 356 92" fill="none" stroke="#ffffff" stroke-width="8"
            stroke-linecap="round" opacity=".55"/>
      <!-- 脑后垂发 -->
      <path d="M316 106 C 372 138 400 206 400 288 C 400 358 386 424 372 470 L 428 470
               C 440 388 448 300 438 230 C 426 150 382 104 316 106 Z"
            fill="#e4ecf7" stroke="${L}" stroke-width="3"/>
      <path d="M344 146 C 378 188 392 246 390 310 C 388 372 378 428 366 470 L 344 470
               C 358 424 370 362 370 302 C 370 238 360 186 344 146 Z" fill="#c2d0e3" opacity=".9"/>
      <!-- 颊前一缕（贴着下颌线，不压脸） -->
      <path d="M300 150 C 318 196 322 250 314 302 C 308 340 298 366 288 382 L 268 370
               C 284 342 296 300 296 250 C 296 202 290 174 300 150 Z"
            fill="#dbe4f0" stroke="${L}" stroke-width="2.6"/>
      <g stroke="${L}" stroke-width="2.2" fill="none" opacity=".5">
        <path d="M366 152 C 388 206 396 276 388 356"/>
        <path d="M392 196 C 408 244 412 310 404 386"/>
      </g>
    </g>
  </g>
</svg>`;
}

let u=0;
function set(label,opts){
  const w=document.createElement('div'); w.className='v';
  const t=document.createElement('div'); t.className='tiles';
  [256,128,64,32].forEach(s=>{
    const d=document.createElement('div');
    d.innerHTML=svg(++u,{...opts,s});
    t.appendChild(d.firstChild);
  });
  w.appendChild(t);
  const l=document.createElement('div'); l.className='lbl'; l.textContent=label;
  w.appendChild(l); return w;
}
const r1=document.getElementById('r1');
r1.appendChild(set('E-1 平静（推荐）',{}));
r1.appendChild(set('E-2 眨眼 · 她的调调',{wink:true}));
r1.appendChild(set('E-3 特写裁切',{zoom:true}));
const r2=document.getElementById('r2');

r2.appendChild(set('C-1 圆形裁切',{circle:true}));
r2.appendChild(set('C-2 反白底',{bg:'#f4efe6',bg2:'#e6ddcd'}));
r2.appendChild(set('C-3 纯藏青',{bg:'#101a2e',bg2:'#0a1120'}));
</script>
</body>
</html>
