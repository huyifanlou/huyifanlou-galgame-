<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>他山之石 · 镜荧头像图标 v2</title>
<style>
  body{background:#0a0c11;color:#dfe3ea;font:"Microsoft YaHei",sans-serif;padding:26px 32px 56px;margin:0}
  h1{font-size:21px;letter-spacing:.16em;margin:0 0 4px}
  .sub{font-size:12px;color:#8892a3;margin-bottom:18px}
  h2{font-size:14px;letter-spacing:.12em;color:#9fb3c8;margin:26px 0 12px;font-weight:600;
     border-left:3px solid #5fe0c8;padding-left:9px}
  .row{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
  .v{text-align:center}
  .v .lbl{font-size:11px;color:#8892a3;margin-top:8px;letter-spacing:.06em}
  canvas{image-rendering:pixelated;display:block;border-radius:10%}
  .tiles{display:flex;gap:12px;align-items:flex-end}
  .note{margin-top:24px;border:1px solid #232b38;border-radius:6px;padding:16px 20px;background:#0e1219;
        font-size:12.5px;line-height:1.9;color:#9aa5b5;max-width:1560px}
  .note b{color:#cfe6dd}
</style>
</head>
<body>
<h1>镜荧 · 头像图标 v2</h1>
<div class="sub">64×64 像素格 · 整体缩到 0.82 留白 · 加深色描边 · 刘海改发束 · 眼睛放大下移</div>

<h2>一、表情与细节</h2>
<div class="row" id="r1"></div>
<h2>二、底色与外框</h2>
<div class="row" id="r2"></div>

<div class="note">
  <b>描边是必须的</b>：银白发在浅色桌面（Windows 浅色任务栏、白色壁纸）上会整个消失，
  所以整张图先按轮廓偏移画一层深色描边再画本体，任何底色都能站住。<br>
  <b>32px 一栏是硬指标</b>：任务栏就那么大，眼睛与刘海的分离度必须还看得出来。
</div>

<script>
const N=64, SIZES=[256,128,64,32];
const DARK={
  hair:'#eaf0f8', hairMid:'#c6d2e2', hairDark:'#9db0c8',
  skin:'#ffe4d0', skinShade:'#eabfa6', blush:'#f3a89e',
  eyeW:'#f7fbff', eyeB:'#3f86d8', eyeD:'#122036', eyeHi:'#d6f0ff',
  mouth:'#c96a6a', fang:'#ffffff', dress:'#223049', dressA:'#43617f',
  teal:'#5fe0c8', gold:'#ffbe6a', line:'#0a1020'
};
const LIGHT={...DARK, hair:'#cfd9e6', hairMid:'#a9b8cc', hairDark:'#7f92aa', line:'#1b2740'};

function makeCtx(cv,cfg){
  const g=cv.getContext('2d'), P=cfg.light?LIGHT:DARK, s=cfg.scale||0.82;
  const T=(v)=>(v-0.5)*s+0.5;
  const H={g,P,
    px(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(T(x)*N),Math.round(T(y)*N),
        Math.max(1,Math.round(w*s*N)),Math.max(1,Math.round(h*s*N)))},
    col(x,y0,y1,c){g.fillStyle=c;g.fillRect(Math.round(T(x)*N),Math.round(T(y0)*N),
        1,Math.max(1,Math.round((y1-y0)*s*N)))},
    ell(cx,cy,rx,ry,c){g.fillStyle=c;
      for(let y=0;y<N;y++)for(let x=0;x<N;x++){
        const u=(x+.5)/N, v=(y+.5)/N;
        const a=(u-.5)/s+.5-cx, b=(v-.5)/s+.5-cy;
        if((a*a)/(rx*rx)+(b*b)/(ry*ry)<=1) g.fillRect(x,y,1,1);
      }},
    tri(x0,y0,x1,y1,x2,y2,c){g.fillStyle=c;g.beginPath();
      g.moveTo(T(x0)*N,T(y0)*N);g.lineTo(T(x1)*N,T(y1)*N);g.lineTo(T(x2)*N,T(y2)*N);
      g.closePath();g.fill()},
    rect(x,y,w,h,c){H.px(x,y,w,h,c)}
  };
  return H;
}

// 刘海下沿：中间短、两侧长的发束
const IRREG=[0,1,0,2,1,0,1,3,1,0,2,0,1,0,1,2];   // 发束长短，打破等距波浪
function bangEdge(t,i){                           // t: 0..1 横向位置
  return 0.368 + 0.036*Math.cos((t-0.5)*Math.PI*3.1)
       + 0.058*Math.pow(Math.abs(t-0.5)*2,2.6)
       + 0.013*IRREG[i%IRREG.length];
}

function figure(H,cfg){
  const P=H.P;
  // 后发体量（长发）
  H.ell(.5,.575,.345,.395,P.hairMid);
  H.px(.135,.42,.085,.50,P.hairMid); H.px(.78,.42,.085,.50,P.hairMid);
  // 脸（童稚：宽一点、下巴收圆）
  H.ell(.5,.585,.225,.235,P.skin);
  H.ell(.5,.665,.155,.145,P.skin);
  // 颈 + 晚礼服
  H.px(.445,.775,.11,.07,P.skinShade);
  H.px(.16,.845,.68,.16,P.dress);
  H.tri(.385,.845,.5,.945,.615,.845,P.dress);
  H.px(.372,.845,.026,.11,P.dressA); H.px(.602,.845,.026,.11,P.dressA);
  // 垂在脸侧的长发：外侧一条暗、内侧一条亮，不再逐行交替
  for(let i=0;i<8;i++){
    const y=.32+i*.078, w=.098-i*.006;
    H.px(.148,y,w*.36,.084,P.hairMid);  H.px(.148+w*.36,y,w*.64,.084,P.hair);
    H.px(.852-w,y,w*.64,.084,P.hair);   H.px(.852-w+w*.64,y,w*.36,.084,P.hairMid);
  }
  // 刘海（发束）
  const L=.175,R=.825;
  for(let i=0;i<52;i++){
    const t=i/51, x=L+(R-L)*t;
    H.col(x,.10,bangEdge(t,i),P.hair);
  }
  H.ell(.5,.175,.335,.115,P.hair);                       // 头顶弧
  H.px(.20,.235,.014,.05,P.hairMid); H.px(.42,.245,.014,.055,P.hairMid);
  H.px(.60,.24,.014,.05,P.hairMid); H.px(.765,.235,.014,.05,P.hairMid);
  // 眼（放大、下移）
  const eye=(cx)=>{
    H.px(cx-.072,.487,.144,.020,P.eyeD);                 // 上睫
    H.px(cx-.062,.508,.124,.072,P.eyeW);
    H.px(cx-.048,.508,.096,.072,P.eyeB);
    H.px(cx-.026,.514,.050,.066,P.eyeD);
    H.px(cx-.052,.512,.026,.026,P.eyeHi);
    H.px(cx+.030,.556,.020,.016,'#ffffff');
  };
  const wink=(cx)=>{
    H.px(cx-.072,.505,.144,.022,P.eyeD);
    H.px(cx-.050,.528,.100,.018,P.eyeD);
  };
  if(cfg.wink){ wink(.335); eye(.665); } else { eye(.335); eye(.665); }
  if(cfg.blush!==false){ H.px(.245,.615,.055,.022,P.blush); H.px(.700,.615,.055,.022,P.blush); }
  // 嘴 + 小虎牙
  H.px(.455,.700,.09,.016,P.mouth);
  H.px(.468,.712,.056,.014,P.mouth);
  if(cfg.fang!==false) H.px(.462,.700,.020,.034,P.fang);
}

function render(cv,cfg){
  cv.width=N; cv.height=N;
  const H=makeCtx(cv,cfg);
  H.g.fillStyle=cfg.bg||'#101a2e'; H.g.fillRect(0,0,N,N);
  const g=H.g;
  const R={g,P:H.P,px(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x*N),Math.round(y*N),
      Math.max(1,Math.round(w*N)),Math.max(1,Math.round(h*N)))},
    tri(x0,y0,x1,y1,x2,y2,c){g.fillStyle=c;g.beginPath();g.moveTo(x0*N,y0*N);
      g.lineTo(x1*N,y1*N);g.lineTo(x2*N,y2*N);g.closePath();g.fill()}};
  if(cfg.decor) cfg.decor(R);
  // 描边：四向偏移铺一层深色
  const line=H.P.line;
  const basePx=H.px, baseEll=H.ell, baseTri=H.tri, baseCol=H.col;
  H.px=(x,y,w,h)=>basePx(x,y,w,h,line);
  H.ell=(a,b,c,d)=>baseEll(a,b,c,d,line);
  H.tri=(...a)=>baseTri(...a,line);
  H.col=(x,y0,y1)=>baseCol(x,y0,y1,line);
  [[-.016,0],[.016,0],[0,-.016],[0,.016]].forEach(([dx,dy])=>{
    H.px=(x,y,w,h)=>basePx(x+dx,y+dy,w,h,line);
    H.ell=(a,b,c,d)=>baseEll(a+dx,b+dy,c,d,line);
    H.tri=(x0,y0,x1,y1,x2,y2)=>baseTri(x0+dx,y0+dy,x1+dx,y1+dy,x2+dx,y2+dy,line);
    H.col=(x,y0,y1)=>baseCol(x+dx,y0+dy,y1,line);
    figure(H,cfg);
  });
  H.px=basePx; H.ell=baseEll; H.tri=baseTri; H.col=baseCol;
  figure(H,cfg);
  if(cfg.after) cfg.after(R);
}

function card(cfg,label){
  const w=document.createElement('div'); w.className='v';
  const t=document.createElement('div'); t.className='tiles';
  SIZES.forEach(s=>{const cv=document.createElement('canvas');
    cv.style.width=s+'px'; cv.style.height=s+'px'; render(cv,cfg); t.appendChild(cv)});
  w.appendChild(t);
  const l=document.createElement('div'); l.className='lbl'; l.textContent=label;
  w.appendChild(l); return w;
}

const r1=document.getElementById('r1');
r1.appendChild(card({},"P-1 标准像（推荐）"));
r1.appendChild(card({wink:true},"P-2 眨眼"));
r1.appendChild(card({fang:false,blush:false},"P-3 收虎牙腮红 · 更冷"));
r1.appendChild(card({after:(R)=>{
  R.tri(.00,1.00,.16,.70,.34,1.00,'#16273c');
  R.tri(.66,1.00,.86,.66,1.04,1.00,'#1b3050');
  R.px(.795,.075,.062,.062,R.P.teal); R.px(.808,.062,.030,.030,'#8ef4e0');
}},"P-4 山脊 + 右上青石"));

const r2=document.getElementById('r2');
r2.appendChild(card({bg:'#070c16'},"C-1 近黑夜蓝"));
r2.appendChild(card({bg:'#f4efe6',light:true},"C-2 反白底（发色压暗）"));
r2.appendChild(card({bg:'#101a2e',after:(R)=>{
  const g=R.g; g.fillStyle=R.P.teal;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const u=(x+.5)/N-.5, v=(y+.5)/N-.5, d=Math.sqrt(u*u+v*v);
    if(d>0.470&&d<0.492) g.fillRect(x,y,1,1);
  }}},"C-3 青环徽章"));
</script>
</body>
</html>
